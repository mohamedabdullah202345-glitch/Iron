<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IRON">
<title>IRON</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' fill='%230a0a0a'/%3E%3Crect x='216' y='96' width='80' height='320' fill='%23e11d1d'/%3E%3Crect x='156' y='96' width='200' height='44' fill='%23e11d1d'/%3E%3Crect x='156' y='372' width='200' height='44' fill='%23e11d1d'/%3E%3C/svg%3E">
<style>
/* ===== 1. BASE ===== */
:root{--bg:#0a0a0a;--card:#151515;--line:#2e2e2e;--tx:#f2f2f2;--mut:#a0a0a0;--red:#e11d1d;--rt:#ff5c5c;--grn:#22c55e;
--hf:'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue Condensed',Impact,sans-serif;
--bf:system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans Arabic',sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{background:radial-gradient(ellipse 80% 40% at 50% -5%,#4a0d0d 0%,transparent 70%),var(--bg);background-attachment:fixed;color:var(--tx);font-family:var(--bf);font-size:16px;min-height:100%;padding-top:env(safe-area-inset-top,0px)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;text-align:start}
:focus-visible{outline:3px solid #fff;outline-offset:2px}
[hidden]{display:none!important}
.imp{font-family:var(--hf);font-weight:800;letter-spacing:.5px}
.t{letter-spacing:2px;font-size:12px;color:var(--mut);text-transform:uppercase}
h2.imp{font-size:34px;margin-bottom:4px}
small,.hint{color:var(--mut);font-size:13px}
.hint{margin:6px 0}

/* ===== 2. LAYOUT + NAV ===== */
#app{max-width:480px;margin:0 auto;padding:18px 18px calc(100px + env(safe-area-inset-bottom,0px));position:relative;z-index:1;min-height:100%}
nav{position:fixed;inset-inline:0;bottom:0;z-index:10;background:#0a0a0af2;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;max-width:480px;margin:0 auto}
nav button{flex:1;min-height:60px;color:var(--mut);font-size:12px;letter-spacing:1px;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-top:2px solid transparent;text-align:center}
nav button b{font-size:19px;font-weight:400}
nav button[aria-current=page]{color:var(--rt);border-top-color:var(--red)}

/* ===== 3. BUTTONS + FORMS ===== */
.btn{display:block;width:100%;min-height:56px;background:var(--red);color:#fff;border-radius:4px;margin:14px 0;padding:14px;font-family:var(--hf);font-weight:800;font-size:23px;letter-spacing:3px;text-transform:uppercase;text-align:center;transition:transform .12s}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--tx);font-size:17px;letter-spacing:2px;min-height:48px;margin:8px 0}
.btn:disabled{opacity:.4;cursor:default}
.btn:active:not(:disabled),.lnk:active,.mk:active{transform:scale(.97)}
.lnk{min-height:44px;padding:0 16px;background:#1a1a1a;border:1px solid var(--line);border-radius:22px;font-size:13px;letter-spacing:1px;text-transform:uppercase;margin:4px 6px 4px 0;text-align:center}
[dir=rtl] .lnk{margin:4px 0 4px 6px}
.lnk[aria-pressed=true]{border-color:var(--red);color:var(--rt)}
input[type=text],textarea{width:100%;background:var(--card);border:1px solid var(--line);color:var(--tx);padding:12px;border-radius:4px;margin:6px 0;min-height:48px}
textarea{min-height:110px;resize:vertical}
.ed{display:flex;gap:8px;align-items:center}.ed input{margin:0}
.ed button{background:var(--line);min-width:48px;min-height:48px;border-radius:4px;font-size:20px;text-align:center}
.seg{display:flex;gap:8px;margin:8px 0}.seg button{flex:1;min-height:48px;border:1px solid var(--line);border-radius:4px;text-align:center;background:var(--card)}
.seg button[aria-pressed=true]{border-color:var(--red);color:var(--rt);background:#1c0f0f}
.sb{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#1a1a1a;font-size:18px;text-align:center}
.flip{display:inline-block}[dir=rtl] .flip{transform:scaleX(-1)}

/* ===== 4. TODAY ===== */
.big{font-size:120px;line-height:.9;color:var(--red);margin:6px 0}
.big span{display:inline-block;animation:flame 2.4s ease-in-out infinite}
.goal{margin:6px 0 10px;border-inline-start:3px solid var(--red);padding:4px 12px}.goal b{display:block;font-size:17px;margin-top:2px}
.card{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:8px 0;font-size:14px;line-height:1.4}
.card .ic{font-size:24px}.card.sh{border-color:#3b82f6}.card.sh.off{border-color:var(--line);opacity:.75}.card.sh.warn{border-color:var(--rt);background:#1c0f0f;opacity:1}
.card.bk{border-color:#a16207;flex-wrap:wrap}.card.bk .lnk{margin:0}
.qc{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-inline-start:4px solid var(--red);border-radius:4px;padding:12px 16px 16px;margin:12px 0 4px}
.qc:after{content:"";position:absolute;top:0;bottom:0;width:60px;left:-90px;background:linear-gradient(90deg,transparent,#ffffff14,transparent);transform:skewX(-20deg);animation:sweep 5s infinite}
.qm{font-size:72px;line-height:.8;color:var(--red);height:36px;margin-top:6px}
.qt{font-size:21px;font-weight:700;line-height:1.3;font-family:Georgia,'Times New Roman',serif;font-style:italic}
.qa{margin-top:12px;color:var(--rt);font-size:14px;letter-spacing:2px;text-transform:uppercase;font-weight:700}
.qin{animation:cardin .6s cubic-bezier(.2,.9,.3,1.2) both}.ain{animation:rise .6s .9s both}
.w{display:inline-block;white-space:pre;animation:wordin .55s ease both}
.mh{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:8px}
.pl{width:48px;height:48px;border-radius:50%;background:var(--red);color:#fff;font-size:26px;line-height:1;text-align:center;box-shadow:0 0 16px #e11d1d77;transition:transform .15s}.pl:active{transform:scale(.85) rotate(90deg)}
.bar{height:4px;background:var(--line);margin:8px 0 6px;border-radius:2px;overflow:hidden}.bar i{display:block;height:100%;background:var(--red);transition:width .3s}
#app{counter-reset:mi}
.m{counter-increment:mi;border-bottom:1px solid #222}
.mr{display:flex;align-items:center}
.mk{flex:1;display:flex;align-items:center;gap:14px;min-height:56px;padding:6px 2px;font-size:18px;font-weight:700;transition:transform .12s}
.mk .bx{width:28px;height:28px;border:2px solid #666;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-size:16px;color:#000}
.mk .mtx:before{content:counter(mi,decimal-leading-zero);font-family:var(--hf);font-weight:800;color:var(--rt);font-size:16px;margin-inline-end:12px;letter-spacing:1px}
.m.d .mk{opacity:.6;text-decoration:line-through}.m.d .bx{background:var(--tx);border-color:var(--tx)}
.ar{width:48px;height:48px;color:var(--mut);font-size:16px;text-align:center;transition:transform .25s}.m.open .ar{transform:rotate(180deg)}
.mx{display:none;padding:0 4px 14px}.m.open .mx{display:block;animation:rise .3s ease both}
.mx small{display:block;margin-bottom:10px;line-height:1.4}
.dl{min-height:44px;padding:0 16px;border:1px solid #5a2a2a;color:#ff8a8a;border-radius:22px;font-size:13px}
.won-box{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-inline-start:4px solid var(--red);border-radius:8px;padding:14px 16px;margin:14px 0}
.rest-box{border:2px solid #666;color:var(--tx);padding:16px;text-align:center;margin:12px 0;border-radius:4px}.rest-box b{display:block;font-size:30px;margin-bottom:4px}
.tm{border:1px solid var(--line);background:linear-gradient(180deg,#181818,#0f0f0f);padding:14px;border-radius:10px;margin:14px 0;text-align:center}
.tm>.t{margin-bottom:12px}.tm.ok{border-color:#444}.tm.ok>.t{color:var(--tx)}
.tg{display:flex;justify-content:center;align-items:flex-start;gap:6px;direction:ltr}
.u{background:#0a0a0a;border:1px solid #2a2a2a;border-radius:8px;padding:8px 0 6px;width:76px}
.u b{display:block;font-size:46px;line-height:1;color:var(--red);margin:0}.u small{display:block;font-size:12px;letter-spacing:3px;margin-top:5px}
.sp{font-size:36px;color:#555;line-height:56px}
.tp{height:5px;background:#222;border-radius:3px;margin-top:14px;overflow:hidden}.tp i{display:block;height:100%;background:var(--red);border-radius:3px}
.tm.ok .u b{color:var(--tx)}.tm.ok .tp i{background:var(--tx)}.tg.low .u b{animation:blink 1s ease-in-out infinite}

/* ===== 5. MISSIONS ===== */
.chips{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:8px 0 12px}
.chips button{min-height:44px;border:1px solid var(--line);border-radius:6px;font-size:12px;text-align:center;background:var(--card);padding:0}
.chips button[aria-pressed=true]{border-color:var(--red);background:#1c0f0f;color:var(--rt);font-weight:700}
.tag{display:inline-block;font-size:12px;color:#fbbf24;margin-inline-start:8px;font-weight:400}
.sub{display:block;font-size:12px;color:var(--mut);font-weight:400;margin-top:2px}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.ct:last-child:nth-child(odd){grid-column:span 2}
.ct{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 12px;min-height:64px}.ct b{display:block;font-size:22px;line-height:1}.ct small{display:block;margin-top:6px}
.ct[aria-expanded=true]{border-color:var(--red);background:#1c0f0f}.ct[aria-expanded=true] b{color:var(--rt)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.row small{display:block;margin-top:3px;line-height:1.35}
.row button{min-width:48px;min-height:48px;font-size:20px;color:var(--rt);text-align:center}
.cl{margin-top:6px;animation:rise .3s ease both}
.packs{display:flex;gap:8px}.packs .btn{margin:0;padding:8px}.packs small{letter-spacing:1px}

/* ===== 6. LOG + ME ===== */
.note{background:var(--card);border-inline-start:3px solid var(--red);padding:10px 12px;margin-bottom:8px;font-size:14px;border-radius:2px;line-height:1.4}
.note span{display:block;font-size:12px;color:var(--mut);letter-spacing:2px;margin-bottom:4px}
.st{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:14px 0}
.st div{background:var(--card);border:1px solid var(--line);padding:12px 6px;text-align:center;border-radius:4px}
.st b{display:block;font-size:30px;color:var(--rt)}.st span{font-size:12px;letter-spacing:1px;color:var(--mut);text-transform:uppercase}
.rc{display:flex;gap:16px;align-items:center;background:linear-gradient(135deg,#1d0c0c,#141414);border:1px solid var(--red);border-radius:12px;padding:16px;margin:12px 0 10px}.rc>div:last-child{flex:1}
.ri{font-size:52px;animation:qpulse 3s ease-in-out infinite}.rn{font-size:32px;line-height:1}.rc small{display:block;margin-top:6px}
.lad{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.lv{flex:0 0 auto;width:76px;text-align:center;padding:8px 2px;border:1px solid var(--line);border-radius:8px;background:var(--card)}.lv span{font-size:24px;display:block}.lv small{font-size:12px;letter-spacing:.5px}
.lv.on{border-color:var(--red)}.lv.lock{opacity:.4;filter:grayscale(1)}
.hm{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;direction:ltr}
.hc{display:block;aspect-ratio:1;border-radius:5px;background:#1a1a1a;border:2px solid transparent}
.hc.w{background:var(--red);box-shadow:0 0 8px #e11d1d66}.hc.s{background:transparent;border-color:var(--rt)}.hc.r{background:#555}.hc.td{outline:2px solid #ffffff66;outline-offset:1px}
.leg{display:flex;gap:14px;margin-top:8px;font-size:12px;color:var(--mut);flex-wrap:wrap}
.leg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px;border:2px solid transparent}
.bg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.b{background:var(--card);border:1px solid var(--line);border-radius:8px;text-align:center;padding:12px 4px;filter:grayscale(1);opacity:.45}.b.on{filter:none;opacity:1;border-color:var(--red)}.b span{font-size:28px;display:block}.b small{letter-spacing:.5px}
.wk{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 14px;margin:8px 0}
.wk div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}.wk div:last-child{border:0}.wk b{color:var(--rt);text-align:end}
.sec{margin:22px 0 8px}

/* ===== 7. SETUP ===== */
.su{padding-top:20px}.su .logo{font-size:64px;color:var(--red);letter-spacing:6px;line-height:1}.su h2{margin:18px 0 8px}
.dots{display:flex;gap:8px;margin:12px 0}.dots i{height:5px;flex:1;background:var(--line);border-radius:3px}.dots i.on{background:var(--red)}

/* ===== 8. SHEET + TOAST + EFFECTS ===== */
#sh{position:fixed;inset:0;background:#000b;display:none;z-index:50}
#sh.on{display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.pn{width:100%;max-width:480px;max-height:86%;overflow:auto;background:#141414;border-top:2px solid var(--red);border-radius:18px 18px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:sheetup .35s cubic-bezier(.2,.9,.3,1)}
.shh{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#141414;padding:6px 0 10px;margin-bottom:6px;z-index:2}.shT{font-size:22px;letter-spacing:2px;text-transform:uppercase}
.or{display:flex;justify-content:space-between;align-items:center;width:100%;border-bottom:1px solid var(--line);padding:16px 2px;min-height:64px;font-size:17px;font-weight:700}.or small{display:block;font-weight:400;margin-top:3px}.or i{font-style:normal;color:var(--rt);font-size:24px}
#tst{position:fixed;inset-inline:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));max-width:448px;margin:0 auto;z-index:70;display:none;align-items:center;justify-content:space-between;gap:10px;background:#222;border:1px solid var(--red);border-radius:8px;padding:4px 6px 4px 16px;font-size:15px}
#tst.on{display:flex;animation:rise .25s ease both}
#tst button{min-height:44px;padding:0 14px;color:var(--rt);font-weight:700;letter-spacing:2px}
.em{position:fixed;bottom:-10px;width:4px;height:4px;border-radius:50%;background:#ff6a3d;opacity:0;pointer-events:none;z-index:0;animation:emb linear infinite}
.cf{position:fixed;left:50%;top:60%;width:8px;height:14px;z-index:60;pointer-events:none;animation:cf 1.3s cubic-bezier(.2,.8,.4,1) both}
.in>*{animation:rise .45s ease both}.pop{animation:pop .35s ease}.ha{animation:pop .4s ease both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 #22c55e00}50%{box-shadow:0 0 26px 2px #22c55e88}}
@keyframes flame{0%,100%{text-shadow:0 0 0 #e11d1d00}50%{text-shadow:0 0 30px #e11d1daa}}
@keyframes sweep{0%,55%{left:-90px}100%{left:115%}}
@keyframes qpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes cardin{from{opacity:0;transform:scale(.92) rotate(-1deg)}to{opacity:1;transform:none}}
@keyframes wordin{from{opacity:0;transform:translateY(12px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes sheetup{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes blink{50%{opacity:.45}}
@keyframes emb{0%{transform:translate(0,0);opacity:0}10%{opacity:.8}100%{transform:translate(30px,-105vh);opacity:0}}
@keyframes cf{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),calc(var(--dy) + 420px)) rotate(var(--r));opacity:0}}
/* ===== 8b. FOOTER: ask us + powered by ===== */
.ft{margin:30px 0 0;padding-top:20px;border-top:1px solid var(--line);text-align:center}
.ask{display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;background:#25d366;color:#04230f;border-radius:4px;padding:10px 16px;font-family:var(--hf);font-weight:800;font-size:21px;letter-spacing:3px;text-transform:uppercase;text-decoration:none;transition:transform .12s}
.ask:active{transform:scale(.97)}.ask svg{width:24px;height:24px;flex:0 0 auto;fill:currentColor}
.pw{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:18px;color:var(--mut);font-size:12px;letter-spacing:2px;text-transform:uppercase;direction:ltr}
.pw i{display:grid;place-items:center;width:36px;height:36px;border-radius:9px;background:#f2f2f2}
.pw img{width:26px;height:26px;display:block}
.pw b{font-family:var(--hf);font-weight:800;font-size:20px;letter-spacing:4px;color:var(--tx)}
/* ===== 8c. SPLASH (app open) + ASK US emphasis ===== */
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:radial-gradient(ellipse 80% 40% at 50% 35%,#1b0f3d 0%,transparent 70%),#0a0a0a;animation:splashout .6s ease 1.7s forwards}
#splash i{display:grid;place-items:center;width:128px;height:128px;border-radius:30px;background:#f2f2f2;margin-bottom:14px;animation:splashin .7s cubic-bezier(.2,.9,.3,1.2) both}
#splash img{width:96px;height:96px;display:block}
#splash span{font-size:12px;letter-spacing:4px;text-transform:uppercase;color:var(--mut);animation:rise .6s .35s both}
#splash b{font-family:var(--hf);font-weight:800;font-size:40px;letter-spacing:8px;color:var(--tx);animation:rise .6s .5s both}
@keyframes splashout{to{opacity:0;visibility:hidden}}
@keyframes splashin{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.askc{background:linear-gradient(135deg,#0d2a18,#141414);border:1px solid #25d366;border-radius:12px;padding:16px;text-align:center}
.askc p{font-size:16px;font-weight:700;line-height:1.4;margin-bottom:12px}
.ask{animation:askpulse 2.2s ease-out infinite}
@keyframes askpulse{0%{box-shadow:0 0 0 0 #25d366aa}70%,100%{box-shadow:0 0 0 16px #25d36600}}
nav button{position:relative}
.nd{position:absolute;top:8px;inset-inline-start:calc(50% + 8px);width:12px;height:12px;border-radius:50%;background:#25d366;box-shadow:0 0 0 2px #0a0a0a;animation:ndp 1.8s ease-out infinite}
@keyframes ndp{0%{box-shadow:0 0 0 2px #0a0a0a,0 0 0 2px #25d366aa}100%{box-shadow:0 0 0 2px #0a0a0a,0 0 0 12px #25d36600}}
/* ===== 8d. v3: rank badge, accordions, focus, nav icons ===== */
.won-box .wi{color:var(--rt);flex:0 0 auto;display:grid}.won-box .wi svg{width:38px;height:38px}
.won-box b{display:block;font-size:24px;line-height:1.1}.won-box small{display:block;margin-top:4px}
.card .ic{display:grid;place-items:center;color:var(--rt)}
.rk{display:grid;place-items:center;width:56px;height:62px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(160deg,#ff4d4d,#a30f0f);color:#fff;font-family:var(--hf);font-weight:800;font-size:21px;letter-spacing:1px;direction:ltr}
.lv .rk{width:36px;height:40px;font-size:12px;margin:0 auto 6px;letter-spacing:0}
.bn{display:block;font-family:var(--hf);font-weight:800;font-size:32px;line-height:1.1;color:var(--rt)}
.b .bn{font-size:32px}
.acc{border-top:1px solid var(--line);margin-top:8px}
.acc summary{list-style:none;cursor:pointer;min-height:54px;display:flex;align-items:center;justify-content:space-between;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--mut)}
.acc summary::-webkit-details-marker{display:none}
.acc summary:after{content:"\25BE";font-size:16px;transition:transform .2s}
.acc[open] summary{color:var(--tx)}.acc[open] summary:after{transform:rotate(180deg)}
.acc>div{padding-bottom:14px}
select{width:100%;background:var(--card);border:1px solid var(--line);color:var(--tx);padding:12px;border-radius:4px;margin:6px 0;min-height:48px;font:inherit}
nav button b{display:grid;place-items:center;height:24px}
nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fc .tg .u{width:96px}.fc .u b{font-size:58px}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.cf,.em{display:none}#splash{animation:splashout 0s 1.7s forwards!important}}
.lnk svg{width:16px;height:16px;vertical-align:-3px;margin-inline-end:6px}
.mk .mtx:before{display:inline-block;text-decoration:none}
.won-box{background:transparent;border-inline-start-color:#8a8a8a;padding:12px 14px;gap:12px}
.won-box .wi{color:var(--tx)}.won-box .wi svg{width:28px;height:28px}
.won-box b{font-size:20px}.won-box small{margin-top:2px}

/* ===== v4: quote buttons, rest row, timer, rank ===== */
.qbar{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 6px}
.qb{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 10px;border-radius:12px;background:linear-gradient(180deg,#1e1e1e,#141414);border:1px solid var(--line);font-size:14px;font-weight:700;letter-spacing:.5px;text-align:center;transition:transform .12s,background .2s,border-color .2s}
.qb svg{width:19px;height:19px;flex:0 0 auto;transition:transform .35s}
.qb:active{transform:scale(.97)}.qb.nw:active svg{transform:rotate(180deg)}
.qb[aria-pressed=true]{border-color:var(--red);background:linear-gradient(180deg,#2e1212,#1a0d0d);color:var(--rt)}
.rr{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:0 16px;margin:10px 0;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:15px;font-weight:600;color:var(--tx);transition:transform .12s}
.rr:active{transform:scale(.98)}.rr svg{width:22px;height:22px;color:var(--mut);flex:0 0 auto}
.rr.off{color:var(--mut);font-weight:400;font-size:13px}
.tm{background:linear-gradient(180deg,#1a1313,#101010);border:1px solid #2c2020;border-radius:16px;padding:16px 12px 18px;margin:14px 0}
.tm>.t{margin-bottom:10px;font-size:11px;letter-spacing:3px}
.tm .tg{gap:0;align-items:center}
.tm .u{background:none;border:0;border-radius:0;padding:0;width:auto;flex:1}
.tm .u b{font-size:56px;font-weight:800;letter-spacing:1px;font-variant-numeric:tabular-nums}
.tm .u small{font-size:10px;letter-spacing:3px;margin-top:6px;color:var(--mut)}
.tm .sp{font-size:34px;line-height:1;color:#4a3a3a;flex:0 0 auto;margin-bottom:18px}
.tm .tp{height:4px;margin-top:16px;background:#2a2222}
.tm.ok{background:var(--card);border-color:var(--line)}
.fc .tg .u{flex:0 0 auto;width:96px}.fc .u b{font-size:58px}
.rc{gap:18px;padding:20px 18px;border-radius:18px;border:1px solid #5a1a1a;background:radial-gradient(circle at 15% 0%,#3d1010,#151515 70%)}
.ri{animation:none;filter:drop-shadow(0 4px 14px #e11d1d99)}
.rc .rk{width:76px;height:84px;font-size:30px}
.rc .rn{font-size:38px;margin-top:2px}
.rb{display:flex;align-items:center;gap:10px;margin-top:12px}.rb .tp{flex:1;margin:0;height:6px}
.rb b{font-size:15px;color:var(--rt);direction:ltr;letter-spacing:1px}
.lad{gap:0;padding:6px 0 8px;margin:4px 0}
.lv{position:relative;width:72px;border:0;background:none;padding:0}
.lv .rk{width:40px;height:44px;font-size:13px;margin:0 auto 8px;position:relative;z-index:1;background:linear-gradient(160deg,#4a4a4a,#2a2a2a);color:#aaa}
.lv.done .rk{background:linear-gradient(160deg,#ff4d4d,#a30f0f);color:#fff}
.lv.on .rk{transform:scale(1.2)}
.lv:not(:first-child):before{content:"";position:absolute;top:21px;inset-inline-end:50%;width:100%;height:3px;background:#2a2a2a}
.lv.done:not(:first-child):before{background:var(--red)}
.lv small{display:block;font-size:11px;color:var(--mut);letter-spacing:0}.lv.on small{color:var(--tx);font-weight:700}
.lv.lock{opacity:1;filter:none}.lv.lock small{opacity:.55}
</style>
</head>

function pad(n){return n<10?"0"+n:""+n}
function ds(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function pd(s){var p=s.split("-");return new Date(+p[0],p[1]-1,+p[2])}

function wd(s){return(pd(s).getDay()+6)%7}                           /* 0 = Monday */
function wk(s){return addD(s,-wd(s))}                                /* Monday of that week */

/* Walk all days. Gives status per day, streak, best streak, shields used. */
function calc(){
 if(C)return C;

 if(d>td)d=td;
 for(;d<=td;d=addD(d,1)){
  var s;
  if(S.won[d])s="won";
  else if(S.rest[d])s="rest";
  else if(d===td)s="now";
  else if(!tasksFor(d).length)s="off";
  else if(!used[wk(d)]&&prev!=="shield"&&prev!=="miss"){s="shield";used[wk(d)]=d}   /* 1 shield per week, only for a single missed day */
  else s="miss";
  if(s==="won"){run++;if(run>best)best=run}else if(s==="miss")run=0;
  st[d]=s;prev=s}
